<div class="payments">

  <div class="page-header">
    <div class="tabs">
      <button
        class="tab"
        [class.tab--active]="activeTab === 'payments'"
        (click)="activeTab = 'payments'">
        Pagos
      </button>
      <button
        class="tab"
        [class.tab--active]="activeTab === 'memberships'"
        (click)="activeTab = 'memberships'">
        Membresías
      </button>
    </div>
    <button class="btn-primary" (click)="showForm = true" *ngIf="activeTab === 'payments'">
      + Registrar pago
    </button>
  </div>

  <!-- Tab pagos -->
  <div *ngIf="activeTab === 'payments'">

    <div class="toolbar">
      <input
        type="text"
        [(ngModel)]="search"
        (ngModelChange)="applyFilter()"
        placeholder="Buscar por alumno o DNI..."
        class="search-input"
      />
    </div>

    <div class="loading" *ngIf="loading">Cargando...</div>

    <div class="payments-table" *ngIf="!loading">
      <div class="table-header">
        <span>Alumno</span>
        <span>Membresía</span>
        <span>Monto</span>
        <span>Fecha pago</span>
        <span>Válido hasta</span>
      </div>

      <div class="table-row" *ngFor="let p of filtered">
        <span class="col-name">
          {{ p.students?.first_name }} {{ p.students?.last_name }}
          <small>{{ p.students?.dni }}</small>
        </span>
        <span>{{ p.memberships?.name }}</span>
        <span class="col-amount">{{ formatAmount(p.amount) }}</span>
        <span>{{ formatDate(p.paid_at) }}</span>
        <span>{{ formatDate(p.valid_until) }}</span>
      </div>

      <div class="empty" *ngIf="filtered.length === 0">
        No hay pagos registrados
      </div>
    </div>
  </div>

  <!-- Tab membresías -->
  <div *ngIf="activeTab === 'memberships'">
    <app-membership-manager></app-membership-manager>
  </div>

  <!-- Modal nuevo pago -->
  <div class="modal-overlay" *ngIf="showForm" (click)="showForm = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <app-payment-form
        (saved)="onPaymentSaved()"
        (cancel)="showForm = false">
      </app-payment-form>
    </div>
  </div>

</div>
